# Optional data sandbox for local isolation — NOT the default day-to-day path.
# Prefer reusing an existing Postgres via DATABASE_URL in .env (GROKFORGE_ENV=dev).
# App runs as a native binary for development; image build is for release only.
#
# Usage: docker compose up -d
# Maps: Postgres 127.0.0.1:25432 → 5432, Redis 127.0.0.1:26379 → 6379
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grokforge
      POSTGRES_PASSWORD: grokforge
      POSTGRES_DB: grokforge
      TZ: Asia/Shanghai
    volumes:
      - grokforge_pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grokforge -d grokforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  grokforge_pg:
